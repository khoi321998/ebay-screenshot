name: CI

on:
    pull_request:
    push:
        branches: [main, master]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            # `npm ci` already installs Chromium through this project's postinstall script,
            # so an explicit `playwright install` here would just download it a second time.
            - run: npm ci
            - run: npm run build
            - run: npm test
