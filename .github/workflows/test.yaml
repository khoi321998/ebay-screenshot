name: CI

on:
    pull_request:
    push:
        branches: [main, master]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # Chromium is not installed by npm install (that would break the Apify Docker
            # build, where the base image ships it already), so install it explicitly here.
            - run: npm run install-browsers
            - run: npm run build
            - run: npm test
